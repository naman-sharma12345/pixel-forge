                              type: object
                              properties:
                                date: { type: string }
                                revenue: { type: integer }
                                sales: { type: integer }
                          topAssets:
                            type: array
                            items:
                              type: object
                              properties:
                                asset:
                                  $ref: '#/components/schemas/AssetCard'
                                revenue: { type: integer }
                                sales: { type: integer }
                          categoryBreakdown:
                            type: array
                            items:
                              type: object
                              properties:
                                category: { type: string }
                                sales: { type: integer }
                                revenue: { type: integer }

  /creator/sales:
    get:
      tags: [Creator]
      summary: List itemized sales history for creator
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
