        - in: query
          name: limit
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Sales transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            orderId: { type: string }
                            asset:
                              type: object
                              properties:
                                _id: { type: string }
                                title: { type: string }
                                slug: { type: string }
                                thumbnail:
                                  type: object
                                  properties:
                                    url: { type: string }
                            buyer:
                              type: object
                              properties:
                                username: { type: string }
                                avatarUrl: { type: string }
                            price: { type: integer }
                            creatorEarning: { type: integer }
                            paidAt: { type: string, format: date-time }
                      meta:
                        $ref: '#/components/schemas/Meta'

  /admin/stats:
    get:
      tags: [Admin]
      summary: Platform-wide admin metrics and timeline series
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users: { type: integer }
                          creators: { type: integer }
                          assets: { type: integer }
                          orders: { type: integer }
                          revenue: { type: integer }
                          platformFees: { type: integer }
                          signupsSeries:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string }
                                count: { type: integer }
                          revenueSeries:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string }
                                revenue: { type: integer }

  /admin/users:
    get:
      tags: [Admin]
      summary: List registered users with filter controls
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: role
          schema: { type: string, enum: [buyer, creator, admin] }
        - in: query
          name: banned
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 24 }
      responses:
        '200':
          description: Admin user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/UserPublic'
                            - type: object
                              properties:
                                email: { type: string }
                                isBanned: { type: boolean }
                      meta:
                        $ref: '#/components/schemas/Meta'

  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Update user role or suspension status
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [buyer, creator, admin]
                isBanned:
                  type: boolean
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserPublic'

  /admin/assets:
    get:
      tags: [Admin]
      summary: List all catalog assets across all statuses
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [published, rejected, archived] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 24 }
      responses:
        '200':
          description: Admin asset list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/AssetCard'
                            - type: object
                              properties:
                                status: { type: string }
                                rejectionReason: { type: string }
                      meta:
                        $ref: '#/components/schemas/Meta'

  /admin/assets/{id}:
    patch:
      tags: [Admin]
      summary: Moderate asset status, feature flag, or rejection reason
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [published, rejected, archived]
                isFeatured:
                  type: boolean
                rejectionReason:
                  type: string
      responses:
        '200':
          description: Asset moderated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/AssetCard'
                          - type: object
                            properties:
                              status: { type: string }
                              rejectionReason: { type: string }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ConflictError:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentFailedError:
      description: Payment failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    FileTooLargeError:
      description: File too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedFileError:
      description: Unsupported file type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/Meta'
        message:
          type: string

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Some fields are invalid
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string

    Meta:
      type: object
      required: [page, limit, total, totalPages, hasNext]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 24
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5
        hasNext:
          type: boolean
          example: true

    UserPublic:
      type: object
      required: [_id, name, username, avatarUrl, bio, socials, role, createdAt]
      properties:
        _id:
          type: string
        name:
          type: string
        username:
          type: string
        avatarUrl:
          type: string
        bio:
          type: string
        socials:
          type: object
          properties:
            website: { type: string }
            twitter: { type: string }
            itchio: { type: string }
            github: { type: string }
        role:
          type: string
          enum: [buyer, creator, admin]
        createdAt:
          type: string
          format: date-time

    UserMe:
      allOf:
        - $ref: '#/components/schemas/UserPublic'
        - type: object
          required: [email, wishlist, lastLoginAt]
          properties:
            email:
              type: string
              format: email
            wishlist:
              type: array
              items:
                type: string
            lastLoginAt:
              type: string
              format: date-time
              nullable: true

    AssetCard:
      type: object
      required: [_id, slug, title, category, mediaKind, thumbnail, previewAudioUrl, price, isFree, license, tags, isFeatured, stats, creator, createdAt]
      properties:
        _id:
          type: string
        slug:
          type: string
        title:
          type: string
        category:
          type: string
        mediaKind:
          type: string
          enum: [image, audio, other]
        thumbnail:
          type: object
          required: [url]
          properties:
            url: { type: string }
        previewAudioUrl:
          type: string
          nullable: true
        price:
          type: integer
        isFree:
          type: boolean
        license:
          type: string
          enum: [cc0, standard, extended]
        tags:
          type: array
          items:
            type: string
        isFeatured:
          type: boolean
        stats:
          type: object
          properties:
            sales: { type: integer }
            downloads: { type: integer }
            ratingAvg: { type: number }
            ratingCount: { type: integer }
        creator:
          type: object
          properties:
            _id: { type: string }
            username: { type: string }
            name: { type: string }
            avatarUrl: { type: string }
        createdAt:
          type: string
          format: date-time

    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/AssetCard'
        - type: object
          required: [description, previews, fileFormats, meta, fileInfo, status, rejectionReason, stats, updatedAt, isOwned, inWishlist, isMine]
          properties:
            description:
              type: string
            previews:
              type: array
              items:
                type: object
                properties:
                  url: { type: string }
                  kind:
                    type: string
                    enum: [image, audio]
            fileFormats:
              type: array
              items:
                type: string
            meta:
              type: object
              properties:
                resolution: { type: string }
                frames: { type: integer }
                durationSec: { type: number }
                bpm: { type: number }
                loopable: { type: boolean }
                sampleRate: { type: number }
            fileInfo:
              type: object
              properties:
                format: { type: string }
                bytes: { type: integer }
                originalName: { type: string }
            status:
              type: string
              enum: [published, rejected, archived]
            rejectionReason:
              type: string
            stats:
              type: object
              properties:
                views: { type: integer }
                downloads: { type: integer }
                sales: { type: integer }
                ratingAvg: { type: number }
                ratingCount: { type: integer }
                wishlistCount: { type: integer }
            updatedAt:
              type: string
              format: date-time
            isOwned:
              type: boolean
            inWishlist:
              type: boolean
            isMine:
              type: boolean

    Review:
      type: object
      required: [_id, rating, comment, createdAt, updatedAt, user]
      properties:
        _id:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            _id: { type: string }
            username: { type: string }
            name: { type: string }
            avatarUrl: { type: string }

    CartView:
      type: object
      required: [items, subtotal, count]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              asset:
                $ref: '#/components/schemas/AssetCard'
              addedAt:
                type: string
                format: date-time
        subtotal:
          type: integer
        count:
          type: integer

    OrderView:
      type: object
      required: [_id, items, subtotal, platformFee, total, currency, status, provider, paidAt, createdAt]
      properties:
        _id:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              asset: { type: string }
              title: { type: string }
              price: { type: integer }
              creator: { type: string }
              license: { type: string }
              creatorEarning: { type: integer }
        subtotal:
          type: integer
        platformFee:
          type: integer
        total:
          type: integer
        currency:
          type: string
          example: INR
        status:
          type: string
          enum: [created, paid, failed]
        provider:
          type: string
          enum: [mock, free]
        providerOrderId:
          type: string
        providerPaymentId:
          type: string
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    LibraryItem:
      type: object
      required: [_id, asset, pricePaid, downloadCount, lastDownloadedAt, createdAt]
      properties:
        _id:
          type: string
        asset:
          $ref: '#/components/schemas/AssetCard'
        pricePaid:
          type: integer
        downloadCount:
          type: integer
        lastDownloadedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, username, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        username:
          type: string
          minLength: 3
          maxLength: 20
          pattern: '^[a-z0-9_]+$'
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
        password:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
        username:
          type: string
          minLength: 3
          maxLength: 20
        bio:
          type: string
          maxLength: 300
        socials:
          type: object
          properties:
            website: { type: string }
            twitter: { type: string }
            itchio: { type: string }
            github: { type: string }

    UpdatePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 72

    AuthResponseData:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/UserMe'
        accessToken:
          type: string
