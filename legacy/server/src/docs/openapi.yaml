openapi: 3.0.3
info:
  title: Pixel Forge API
  version: 1.0.0
  description: Complete OpenAPI 3.0 specification for the Pixel Forge indie game asset and audio marketplace.
servers:
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Health
    description: Service health and readiness
  - name: Auth
    description: Authentication, session management and token rotation
  - name: Users
    description: User profiles, avatar upload, password management and wishlists
  - name: Assets
    description: Asset catalog, discovery, uploads, and detail retrieval
  - name: Reviews
    description: Asset ratings and reviews
  - name: Cart
    description: Digital cart management
  - name: Orders
    description: Order placement and order history
  - name: Payments
    description: Mock payment confirmation
  - name: Library
    description: User purchased and claimed asset library
  - name: Downloads
    description: Secured timed download links and direct file download
  - name: Creator
    description: Creator analytics, sales history, and performance
  - name: Admin
    description: Administration dashboard, user moderation, and asset curation

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health check
      description: Returns health status, server timestamp, uptime, and database connection state.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          time:
                            type: string
                            format: date-time
                          uptimeSec:
                            type: integer
                            example: 42
                          db:
                            type: string
                            enum: [connected, disconnected]
                            example: connected

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a user account, sets the pf_rt refresh cookie, and returns access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: pf_rt=...; Path=/api/auth; HttpOnly
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponseData'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate user
      description: Logs in by email or username, updates lastLoginAt, sets pf_rt cookie, and returns access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
                example: pf_rt=...; Path=/api/auth; HttpOnly
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponseData'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Validates pf_rt refresh cookie, rotates the refresh cookie, and issues a new access token.
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthResponseData'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out user
      security:
        - bearerAuth: []
      description: Clears refresh cookie and increments user tokenVersion to invalidate existing tokens.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: 'null'
                        example: null
                      message:
                        type: string
                        example: Logged out

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Users]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMe'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload user avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMe'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '413':
          $ref: '#/components/responses/FileTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedFileError'

  /users/me/password:
    patch:
      tags: [Users]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: 'null'
                        example: null
                      message:
                        type: string
                        example: Password updated. Please log in again on other devices.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users/me/become-creator:
    post:
      tags: [Users]
      summary: Become a creator
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role updated to creator
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserMe'
                      message:
                        type: string
                        example: You are now a creator! Head to the Creator Studio.

  /users/me/wishlist:
    get:
      tags: [Users]
      summary: Get user wishlist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of wishlisted assets in reverse addition order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetCard'

  /users/me/wishlist/{assetId}:
    post:
      tags: [Users]
      summary: Add asset to wishlist (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
      responses:
        '200':
          description: Wishlist updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wishlist:
                            type: array
                            items:
                              type: string
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags: [Users]
      summary: Remove asset from wishlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{24}$'
      responses:
        '200':
          description: Asset removed from wishlist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          wishlist:
                            type: array
                            items:
                              type: string

  /users/{username}:
    get:
      tags: [Users]
      summary: Get public creator profile and performance stats
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public user profile with aggregated metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/UserPublic'
                          stats:
                            type: object
                            properties:
                              assetCount:
                                type: integer
                              totalSales:
                                type: integer
                              totalDownloads:
                                type: integer
                              avgRating:
                                type: number
        '404':
          $ref: '#/components/responses/NotFoundError'

  /assets:
    get:
      tags: [Assets]
      summary: Browse and search published assets
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: tags
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: integer
        - in: query
          name: maxPrice
          schema:
            type: integer
        - in: query
          name: free
          schema:
            type: string
            enum: ['true']
        - in: query
          name: license
          schema:
            type: string
            enum: [cc0, standard, extended]
        - in: query
          name: mediaKind
          schema:
            type: string
            enum: [image, audio, other]
        - in: query
          name: creator
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, newest, popular, top-rated, price-asc, price-desc]
            default: newest
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 24
            maximum: 48
      responses:
        '200':
          description: List of matching asset cards with pagination meta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetCard'
                      meta:
                        $ref: '#/components/schemas/Meta'
    post:
      tags: [Assets]
      summary: Create and publish a new asset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, category, tags, price, license, fileFormats, thumbnail, file]
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                tags:
                  type: string
                price:
                  type: integer
                license:
                  type: string
                fileFormats:
                  type: string
                meta:
                  type: string
                thumbnail:
                  type: string
                  format: binary
                previews:
                  type: array
                  items:
                    type: string
                    format: binary
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Asset published
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetDetail'

  /assets/home:
    get:
      tags: [Assets]
      summary: Home page curated asset collections
      responses:
        '200':
          description: Featured, trending, newest, freebies, and audio asset lists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          featured:
                            type: array
                            items:
                              $ref: '#/components/schemas/AssetCard'
                          trending:
                            type: array
                            items:
                              $ref: '#/components/schemas/AssetCard'
                          newest:
                            type: array
                            items:
                              $ref: '#/components/schemas/AssetCard'
                          freebies:
                            type: array
                            items:
                              $ref: '#/components/schemas/AssetCard'
                          audio:
                            type: array
                            items:
                              $ref: '#/components/schemas/AssetCard'

  /assets/categories:
    get:
      tags: [Assets]
      summary: Category summary with published asset counts
      responses:
        '200':
          description: Published counts across all 10 categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            label:
                              type: string
                            count:
                              type: integer
                            mediaKind:
                              type: string

  /assets/tags:
    get:
      tags: [Assets]
      summary: Top 30 tags
      responses:
        '200':
          description: Most common tags with asset counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            tag:
                              type: string
                            count:
                              type: integer

  /assets/mine:
    get:
      tags: [Assets]
      summary: List creator's own assets
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [published, rejected, archived]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Creator's assets with status and rejection reasons
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/AssetCard'
                            - type: object
                              properties:
                                status:
                                  type: string
                                rejectionReason:
                                  type: string
                      meta:
                        $ref: '#/components/schemas/Meta'

  /assets/{slug}:
    get:
      tags: [Assets]
      summary: Get full asset details by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed asset view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /assets/{slug}/related:
    get:
      tags: [Assets]
      summary: Get related assets
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Up to 6 related asset cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AssetCard'

  /assets/{id}:
    patch:
      tags: [Assets]
      summary: Update existing asset
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                category:
                  type: string
                tags:
                  type: string
                price:
                  type: integer
                license:
                  type: string
                fileFormats:
                  type: string
                meta:
                  type: string
                thumbnail:
                  type: string
                  format: binary
                previews:
                  type: array
                  items:
                    type: string
                    format: binary
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetDetail'
    delete:
      tags: [Assets]
      summary: Soft-delete asset (archive)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Asset archived
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: 'null'
                        example: null

  /reviews:
    get:
      tags: [Reviews]
      summary: List reviews for an asset
      parameters:
        - in: query
          name: asset
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 24
      responses:
        '200':
          description: Reviews and rating distribution summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reviews:
                            type: array
                            items:
                              $ref: '#/components/schemas/Review'
                          summary:
                            type: object
                            properties:
                              avg:
                                type: number
                              count:
                                type: integer
                              distribution:
                                type: object
                                properties:
                                  1: { type: integer }
                                  2: { type: integer }
                                  3: { type: integer }
                                  4: { type: integer }
                                  5: { type: integer }
                      meta:
                        $ref: '#/components/schemas/Meta'
    post:
      tags: [Reviews]
      summary: Create a review for a purchased asset
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId, rating]
              properties:
                assetId:
                  type: string
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Review'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /reviews/{id}:
    patch:
      tags: [Reviews]
      summary: Update review rating or comment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                comment:
                  type: string
      responses:
        '200':
          description: Review updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Review'
    delete:
      tags: [Reviews]
      summary: Delete review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: 'null'
                        example: null

  /cart:
    get:
      tags: [Cart]
      summary: View cart contents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active cart items and subtotal
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartView'
    delete:
      tags: [Cart]
      summary: Clear entire cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Empty cart view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartView'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an asset to cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId:
                  type: string
      responses:
        '200':
          description: Updated cart view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartView'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /cart/items/{assetId}:
    delete:
      tags: [Cart]
      summary: Remove an item from cart
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated cart view
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartView'

  /orders/checkout:
    post:
      tags: [Orders]
      summary: Checkout cart items and create order
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assetIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Order created with mock payment session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order:
                            $ref: '#/components/schemas/OrderView'
                          payment:
                            type: object
                            properties:
                              provider:
                                type: string
                                example: mock
