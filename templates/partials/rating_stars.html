{% load pf %}<span class="row" style="--gap:4px" aria-label="{% if count %}Rated {{ value }} out of 5 from {{ count }} review{{ count|pluralize }}{% else %}No reviews yet{% endif %}"><span class="stars" aria-hidden="true">{% for i in "12345" %}<span class="{% if forloop.counter <= value|round_int %}on{% endif %}">{{ forloop.counter|star:value }}</span>{% endfor %}</span>{% if count %}<span class="mono font-mono subtle" style="font-size:11px">({{ count }})</span>{% else %}<span class="subtle" style="font-size:11px">New</span>{% endif %}</span>
